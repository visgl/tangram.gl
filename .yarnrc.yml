# tangram-layers
# SPDX-License-Identifier: MIT
# Copyright (c) vis.gl contributors

nodeLinker: node-modules

enableGlobalCache: true

approvedGitRepositories:
  - "https://github.com/NEW-HEAT/thor.gl.git"
  - "https://github.com/tangrams/js-yaml.git"
  - "https://github.com/tangrams/topojson-client.git"

# Trusted first-party vis.gl library releases bypass the release-age gate.
# Keep the default gate for other dependencies and pin selected versions in manifests.
npmPreapprovedPackages:
  - "@math.gl/*"
  - "@loaders.gl/*"
  - "@luma.gl/*"
  - "@deck.gl/*"
  # These exact community prereleases match the deck.gl 10 alpha stack.
  - "@deck.gl-community/geo-layers@10.0.0-alpha.1"
  - "@deck.gl-community/panels@10.0.0-alpha.1"
  - "@deck.gl-community/playground@10.0.0-alpha.1"
  - "@deck.gl-community/widgets@10.0.0-alpha.1"
