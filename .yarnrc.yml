nodeLinker: node-modules

enableGlobalCache: true

approvedGitRepositories:
  - "https://github.com/tangrams/js-yaml.git"
  - "https://github.com/tangrams/topojson-client.git"

# Trusted first-party math.gl/loaders.gl releases bypass the release-age gate.
# Keep the default gate for other dependencies and pin selected versions in manifests.
npmPreapprovedPackages:
  - "@math.gl/*"
  - "@loaders.gl/*"
  # Verified published community release containing merged playground PR #789.
  - "@deck.gl-community/panels@9.4.2"
  - "@deck.gl-community/playground@9.4.2"
