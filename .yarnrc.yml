nodeLinker: node-modules

enableGlobalCache: true

approvedGitRepositories:
  - "https://github.com/tangrams/js-yaml.git"
  - "https://github.com/tangrams/topojson-client.git"

# Explicitly requested, verified first-party prereleases; retain the default
# release-age gate for all other packages. MVT/MLT/PMTiles remain on alpha.9,
# their latest published versions, until their next releases are available.
