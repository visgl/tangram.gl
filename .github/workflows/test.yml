# Copyright (c) vis.gl contributors

name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  generated-artifacts:
    name: Generated artifact smoke test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Confirm renderer artifacts are not committed
        run: test ! -e modules/tangram-renderer/dist
      - name: Build website and examples from source
        run: yarn website:build
      - name: Pack the renderer package
        run: yarn workspace @vis.gl/tangram-renderer pack --out /tmp/tangram-renderer.tgz
      - name: Confirm generated outputs
        run: |
          test -f modules/tangram-renderer/dist/index.js
          test -f modules/tangram-renderer/dist/tangram.min.mjs
          test -f modules/tangram-renderer/dist/tangram-style.schema.json
          test -f website/build/modules/tangram-renderer/dist/index.js
          test -f website/build/examples/deck/index.html
          test -f website/build/examples/classic/index.html
          test -f /tmp/tangram-renderer.tgz

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Run lint
        run: yarn lint
      - name: Check TypeScript
        run: yarn typecheck

  test-node:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Run dev-tools Node tests
        run: yarn test-node

  test-headless:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run dev-tools headless browser tests
        run: yarn test-headless

  test-coverage:
    name: Renderer coverage
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Collect Node coverage blob
        run: |
          mkdir -p .vitest-reports
          yarn test-node --coverage --reporter=blob --outputFile.blob=.vitest-reports/node.json
      - name: Collect browser coverage blob
        run: yarn test-coverage --reporter=blob --outputFile.blob=.vitest-reports/headless.json
      - name: Merge coverage and enforce renderer thresholds
        run: >-
          yarn vitest --config vitest.config.js
          --merge-reports=.vitest-reports
          --coverage
          --coverage.reportsDirectory=coverage
          --coverage.thresholds.statements=78
          --coverage.thresholds.branches=69
          --coverage.thresholds.functions=82
          --coverage.thresholds.lines=78
      - name: Validate coverage scope
        run: yarn coverage:scope
      - name: Publish coverage to job summary
        if: always()
        run: node scripts/write-coverage-summary.mjs
      - name: Publish renderer coverage to Coveralls
        if: success()
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false
      - name: Upload renderer coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-coverage
          path: coverage/
          if-no-files-found: error

  test-website:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Build documentation website
        run: yarn test-website
