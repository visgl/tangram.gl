<html lang="en-us">
  <head>
    <script>
      // Relative assets need the directory form of the URL on static hosts.
      if (!window.location.pathname.endsWith('/')) {
        const directoryUrl = new URL(window.location.href);
        directoryUrl.pathname += '/';
        window.location.replace(directoryUrl.href);
      }
    </script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tangram: WebGL for maps</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.2.0/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-geocoder-mapzen/1.9.4/leaflet-geocoder-mapzen.css">

    <!-- 3rd party libraries -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.2.0/leaflet.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-geocoder-mapzen/1.9.4/leaflet-geocoder-mapzen.js"></script> <!-- leaflet plugin for pelias search UI -->
    <script defer src="lib/FileSaver.js"></script> <!-- used in the demo to save screenshots -->
    <script defer src="lib/keymaster.js"></script> <!-- Keymaster handles keyboard input -->

    <!-- Tangram demo code and renderer -->
    <script type="module" src="main.js"></script>

    <!-- Tangram demo extras -->
    <link rel="stylesheet" href="app/settings-panel.css">
    <script type="module" src="app/settings-panel.js"></script> <!-- deck.gl-community playground -->

    <!-- Uncomment to enable WebGL stats for debugging -->
    <!--
    <script defer src="lib/rStats.js"></script>
    <script defer src="lib/rStats.extras.js"></script>
    <script defer src="app/rStats.js"></script>
    -->
  </head>

  <body class="tangram-classic-standalone">
    <div id="map"></div>
  </body>

</html>
