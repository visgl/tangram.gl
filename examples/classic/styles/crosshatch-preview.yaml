import: crosshatch.yaml

scene:
  background:
    color: '#343438'

cameras:
  perspective:
    type: perspective
    active: true

styles:
  preview-crosshatch:
    base: polygons
    blend: overlay
    lighting: false
    shaders:
      blocks:
        color: |
          vec2 hatchPosition = worldPosition().xy * 0.02;
          float diagonalA = step(0.46, fract(hatchPosition.x + hatchPosition.y));
          float diagonalB = step(0.46, fract(hatchPosition.x - hatchPosition.y));
          float hatch = max(diagonalA, diagonalB);
          color.rgb = mix(vec3(0.20, 0.20, 0.22), vec3(0.88, 0.84, 0.76), hatch);
          color.a *= 0.42;

  preview-building-crosshatch:
    mix: preview-crosshatch
    shaders:
      blocks:
        position: |
          position.z *= 1.0 + (u_map_position.z - 14.0) * 0.06;

  preview-ink-lines:
    base: lines
    lighting: false
    shaders:
      blocks:
        color: |
          color.rgb = vec3(0.08, 0.08, 0.10);

sources:
  preview:
    type: GeoJSON
    url: ../data/crosshatch-preview.geojson

layers:
  preview-land:
    data: {source: preview}
    filter: {kind: land}
    draw:
      preview-crosshatch:
        order: 10000

  preview-buildings:
    data: {source: preview}
    filter: {kind: building}
    draw:
      preview-building-crosshatch:
        order: 10001
        extrude: true

  preview-roads:
    data: {source: preview}
    filter: {kind: road}
    draw:
      preview-ink-lines:
        order: 10002
        width: 8px
