scene:
  scripts:
    - https://visgl.github.io/tangram.gl/modules/tangram-renderer/dist/loaders-gl-worker.js
  background:
    color: '#d9e7ee'

sources:
  map:
    type: MVT
    tilejson: https://tiles.openfreemap.org/planet
    tile_size: 256
    max_zoom: 14
    decoder: loaders-mvt
    attribution: >
      <a href="https://openfreemap.org">OpenFreeMap</a> and
      <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>

layers:
  map:
    data: {source: map, all_layers: true}
    draw:
      polygons:
        order: 0
        color: '#e8e4d8'
        extrude: true
      lines:
        order: 1
        color: '#527b91'
        width: 2px
      points:
        order: 2
        color: '#d45443'
        size: 4px
