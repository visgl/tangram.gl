import: open-light-vector.yaml

scene:
  background:
    color: '#f5f3ef'

cameras:
  perspective:
    type: perspective
    active: true

styles:
  preview-polygons:
    base: polygons
    blend: overlay
    lighting: false

sources:
  preview:
    type: GeoJSON
    url: ../data/crosshatch-preview.geojson

layers:
  preview-land:
    data: {source: preview}
    filter: {kind: land}
    draw:
      preview-polygons:
        order: 10000
        color: [0.933, 0.945, 0.929, 0.32]

  preview-buildings:
    data: {source: preview}
    filter: {kind: building}
    draw:
      preview-polygons:
        order: 10001
        color: [0.776, 0.804, 0.835, 0.45]
        extrude: true

  preview-roads:
    data: {source: preview}
    filter: {kind: road}
    draw:
      lines:
        order: 10002
        color: '#788692'
        width: 8px
