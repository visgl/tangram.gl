import: tron.yaml

scene:
  background:
    color: '#060b18'

cameras:
  perspective:
    type: perspective
    active: true

styles:
  preview-polygons:
    base: polygons
    blend: overlay
    lighting: false

sources:
  preview:
    type: GeoJSON
    url: ../data/crosshatch-preview.geojson

layers:
  preview-land:
    data: {source: preview}
    filter: {kind: land}
    draw:
      preview-polygons:
        order: 10000
        # Keep the preview geometry translucent over the live vector basemap.
        color: [0.063, 0.106, 0.192, 0.28]

  preview-buildings:
    data: {source: preview}
    filter: {kind: building}
    draw:
      preview-polygons:
        order: 10001
        color: [0.09, 0.161, 0.267, 0.68]
        extrude: true

  preview-roads:
    data: {source: preview}
    filter: {kind: road}
    draw:
      lines:
        order: 10002
        color: '#27d7ff'
        alpha: 0.9
        width: 8px
        outline:
          color: '#8c3dff'
          width: 2px
